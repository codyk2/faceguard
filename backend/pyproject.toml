[project]
name = "faceguard"
version = "0.1.0"
description = "Face verification with deepfake screening"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "numpy>=1.26,<2.0",
    "opencv-python-headless>=4.9",
    "pillow>=10.3",
    "onnxruntime>=1.18",
    "insightface==0.7.3",
    "torch>=2.3",
    "transformers>=4.44",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "huggingface_hub>=0.24",
    "datasets>=2.20",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["models: tests that load the real pretrained models (slow)"]
